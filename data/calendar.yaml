# Scenes for the calendar demo card. Titles and labels are what lib/NaturalTime.js
# produces for these queries; the first scene is the no-JS fallback.
- query: call sarah tomorrow at 14:00 for 90min
  enter: Add to Google Calendar
  shift: Save .ics file
  sections:
    - title: Calendar
      rows:
        - { icon: calendar, title: Call sarah, meta: "tomorrow at 14:00 · 1h 30m", kind: Calendar, selected: true }
- query: lunch with tom on friday at 13:00
  enter: Add to Google Calendar
  shift: Save .ics file
  sections:
    - title: Calendar
      rows:
        - { icon: calendar, title: Lunch with tom, meta: "Fri at 13:00 · 1h", kind: Calendar, selected: true }
- query: standup in 3 days at 9:30
  enter: Add to Google Calendar
  shift: Save .ics file
  sections:
    - title: Calendar
      rows:
        - { icon: calendar, title: Standup, meta: "Tue at 09:30 · 1h", kind: Calendar, selected: true }
- query: team offsite 2027-01-15
  enter: Add to Google Calendar
  shift: Save .ics file
  sections:
    - title: Calendar
      rows:
        - { icon: calendar, title: Team offsite, meta: "15 Jan 2027 · All day", kind: Calendar, selected: true }
