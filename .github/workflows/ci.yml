name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import re

          manifest = json.loads(Path("manifest.json").read_text())
          required = {
              "schemaVersion",
              "id",
              "name",
              "version",
              "author",
              "description",
              "kinds",
              "entryPoints",
          }
          missing = required - manifest.keys()
          assert not missing, f"missing manifest fields: {sorted(missing)}"
          assert manifest["schemaVersion"] == 1
          assert manifest["id"] == "io.github.maajix.spotlight"
          assert re.fullmatch(r"\d+\.\d+\.\d+", manifest["version"])
          assert isinstance(manifest["kinds"], list) and manifest["kinds"]
          assert isinstance(manifest["entryPoints"], dict)
          for kind in manifest["kinds"]:
              assert kind in manifest["entryPoints"], f"missing entry point for {kind}"
          for entry_point in manifest["entryPoints"].values():
              assert Path(entry_point).is_file(), f"missing entry point: {entry_point}"
          PY

      - name: Run Python tests
        run: python -m unittest discover -s tests -p '*_test.py' -v

      - name: Run Node.js tests
        run: node --test

      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
