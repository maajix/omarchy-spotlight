baseURL = 'https://maajix.github.io/hugo-spotlight/'
locale = 'en-us'
title = 'Spotlight for Omarchy'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'rss']

[params]
  description = 'A fast, local-first command palette for Omarchy. Launch apps, jump to windows, find files and clipboard history, run commands, calculate, convert, set reminders and search the web from one input.'
  repo = 'https://github.com/maajix/omarchy-spotlight'
  marketplace = 'https://plugins.omarchy.org/plugin.html?id=io.github.maajix.spotlight'
  security = 'https://github.com/maajix/omarchy-spotlight/blob/main/SECURITY.md'
  pluginId = 'io.github.maajix.spotlight'
  version = '1.4.0'
  author = 'Max Randhahn'
  installCommand = 'omarchy plugin add https://github.com/maajix/omarchy-spotlight.git --enable'

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
